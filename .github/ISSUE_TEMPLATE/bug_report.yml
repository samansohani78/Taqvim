name: Bug report
description: Something is broken or behaves incorrectly.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Response times and what to include are described in SUPPORT.md at the root of the repository.
        Crashes and data loss (P0) are fixed within 48 hours of confirmation.
  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - "Crash or data loss (P0)"
        - "A feature does not work (P1)"
        - "Minor problem (P2)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Tap …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Paste the anonymized diagnostics from More → About → Report a problem, if available. Check the text and
        remove anything you do not want to share.
      render: text
