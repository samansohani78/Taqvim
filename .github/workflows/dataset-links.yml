name: Dataset citation links

# D-05/D-09: every citation and link URL in dataset/**/*.json must still resolve. Runs weekly and on demand; some
# official sites block data-centre networks, so a failure is reviewed by a person before any record changes.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Resolve citation URLs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Collect URLs
        run: |
          find dataset -name '*.json' ! -name '*.v1.json' -print0 \
            | xargs -0 --no-run-if-empty jq -r '[.. | .url? // empty] + [.. | .links? // empty | .[]?] | .[]' \
            | sort -u > "$RUNNER_TEMP/urls.txt"
          echo "$(wc -l < "$RUNNER_TEMP/urls.txt") distinct URLs"
      - name: Check URLs
        # Two outcomes, because they mean different things and only one is a defect.
        #
        # 404 and 410 say the document is GONE: the citation no longer leads anywhere and the record needs a new
        # source. That fails the job.
        #
        # 403, 429 and 000 say this runner was REFUSED: unesdoc.unesco.org and iranicaonline.org answer 403 to any
        # non-browser client, and rc.majlis.ir does not answer a GitHub runner at all. A person opening the same link
        # sees the document. Failing on those made the whole job red every week for reasons no edit could fix, and a
        # weekly red tick that is always wrong gets ignored — which is how the 2026-09-28 run sat unread, and with it
        # seven genuinely malformed URLs it could never have distinguished from the noise. They are reported as
        # warnings and listed in the summary for a person to glance at.
        run: |
          gone=0
          blocked=0
          while IFS= read -r url; do
            status=$(curl --silent --location --output /dev/null --write-out '%{http_code}' \
              --retry 3 --retry-delay 5 --max-time 60 --user-agent "Mozilla/5.0 (Taqvim dataset link check)" \
              "$url" || true)
            case "$status" in
              2*|3*)
                echo "ok $status $url"
                ;;
              404|410)
                echo "::error::Citation URL is gone (HTTP $status): $url"
                echo "- **gone** — HTTP $status — $url" >> "$GITHUB_STEP_SUMMARY"
                gone=$((gone + 1))
                ;;
              *)
                echo "::warning::Citation URL could not be checked from this runner (HTTP $status): $url"
                echo "- blocked or unreachable — HTTP $status — $url" >> "$GITHUB_STEP_SUMMARY"
                blocked=$((blocked + 1))
                ;;
            esac
          done < "$RUNNER_TEMP/urls.txt"
          echo "$blocked URL(s) could not be checked from this runner; $gone gone" >> "$GITHUB_STEP_SUMMARY"
          if [ "$gone" -gt 0 ]; then
            echo "$gone citation URL(s) are gone"
            exit 1
          fi
