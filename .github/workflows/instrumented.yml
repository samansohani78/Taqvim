name: Instrumented tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Without a profile avdmanager picks the image's default phone, which on API 36 is 320dp wide: a month grid then has
  # 46dp columns and the accessibility checks (T-1700) fail on a touch target no 7-column calendar can widen there.
  EMULATOR_PROFILE: pixel_6
  GRADLE_OPTS: >-
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

jobs:
  connected:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 33, 36]
        include:
          # API 26 cannot resume from the cached `default_boot` snapshot: the restored framework has no system
          # services ("cmd: Can't find service: settings", "adb: device offline") while sys.boot_completed reads 1,
          # so the runner's `adb shell input keyevent 82` blocks until the job timeout and no test starts. It passed
          # only on a cache miss (a cold boot). Cold-boot it every time; the other levels resume from the snapshot.
          - api-level: 26
            boot-options: -no-snapshot
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner; the emulator needs hardware acceleration"
            exit 1
          fi
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          if command -v udevadm > /dev/null; then
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ env.EMULATOR_PROFILE }}
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          profile: ${{ env.EMULATOR_PROFILE }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run connected tests
        # A healthy leg takes 5–15 minutes; a hung emulator now fails this step instead of being cancelled at 90.
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          profile: ${{ env.EMULATOR_PROFILE }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: >-
            ${{ matrix.boot-options || '-no-snapshot-save' }}
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One retry absorbs runner faults seen here (Maven Central HTTP 429); a real test failure fails both
          # attempts. It cannot help an emulator that hangs before the script starts (see boot-options above).
          # The watch tests (:wear) need a Wear OS image; they run on the wearApi34 managed device, not on this phone.
          script: ./gradlew connectedDebugAndroidTest -x :wear:connectedDebugAndroidTest --continue || (sleep 60 && ./gradlew connectedDebugAndroidTest -x :wear:connectedDebugAndroidTest --continue)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: "**/build/reports/androidTests/"
