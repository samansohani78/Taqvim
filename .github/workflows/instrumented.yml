name: Instrumented tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Without a profile avdmanager picks the image's default phone, which on API 36 is 320dp wide: a month grid then has
  # 46dp columns and the accessibility checks (T-1700) fail on a touch target no 7-column calendar can widen there.
  EMULATOR_PROFILE: pixel_6
  GRADLE_OPTS: >-
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

jobs:
  connected:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 33, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner; the emulator needs hardware acceleration"
            exit 1
          fi
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          if command -v udevadm > /dev/null; then
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run connected tests
        # Every level cold-boots. Resuming a cached `default_boot` snapshot left the framework without system services
        # ("Can't find service: settings" on API 26, "No service published for: input" on API 30) while
        # sys.boot_completed read 1: API 26 hung until the job timeout, API 30 failed in two minutes, and no test ran.
        # A healthy cold-boot leg takes 9–17 minutes; a hung emulator fails this step instead of the job at 90.
        timeout-minutes: 60
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          profile: ${{ env.EMULATOR_PROFILE }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: >-
            -no-snapshot
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One retry absorbs runner faults seen here (Maven Central HTTP 429); a real test failure fails both
          # attempts. It cannot help an emulator that hangs before the script starts.
          # The watch tests (:wear) need a Wear OS image; they run on the wearApi34 managed device, not on this phone.
          script: ./gradlew connectedDebugAndroidTest -x :wear:connectedDebugAndroidTest --continue || (sleep 60 && ./gradlew connectedDebugAndroidTest -x :wear:connectedDebugAndroidTest --continue)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: "**/build/reports/androidTests/"
