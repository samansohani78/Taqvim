name: Benchmarks

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      baseline-profile:
        description: Also generate the baseline and startup profiles (T-1800)
        type: boolean
        default: false

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

jobs:
  macrobenchmark:
    name: Macrobenchmark (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner; the emulator needs hardware acceleration"
            exit 1
          fi
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          if command -v udevadm > /dev/null; then
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Run macrobenchmarks, widget render and map mask timings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Emulator numbers are only used for trend/regression tracking, never as absolute budgets (plan §9).
          script: >-
            ./gradlew :benchmark:connectedBenchmarkAndroidTest :benchmark:micro:connectedReleaseAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY
            -Pandroid.testInstrumentationRunnerArguments.notClass=ir.taqvim.benchmark.BaselineProfileGenerator
      - name: Collect results
        if: always()
        run: |
          mkdir -p build/benchmark-results/macro build/benchmark-results/micro
          cp -r benchmark/build/outputs/connected_android_test_additional_output/. build/benchmark-results/macro/ || true
          cp -r benchmark/micro/build/outputs/connected_android_test_additional_output/. \
            build/benchmark-results/micro/ || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: build/benchmark-results/
      - name: Regression gate (> 10 % fails, T-1801) and §9 budgets (T-1801, T-1803)
        run: |
          python3 -m unittest discover -s tools/benchmark
          python3 tools/benchmark/compare_benchmarks.py \
            --baseline benchmark/baselines \
            --results build/benchmark-results \
            --threshold 0.10 \
            --budgets benchmark/budgets.json \
            --required benchmark/required.json

  baseline-profile:
    name: Baseline and startup profiles (on demand)
    if: github.event_name == 'workflow_dispatch' && inputs.baseline-profile
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner; the emulator needs hardware acceleration"
            exit 1
          fi
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          if command -v udevadm > /dev/null; then
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
      - name: Generate profiles
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew :benchmark:connectedBenchmarkAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=ir.taqvim.benchmark.BaselineProfileGenerator
      # Reviewed by a person and committed as app/src/main/baseline-prof.txt (ADR-0018).
      - uses: actions/upload-artifact@v7
        with:
          name: baseline-profiles
          path: benchmark/build/outputs/connected_android_test_additional_output/
