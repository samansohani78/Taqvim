name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.workers.max=4
    -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64

jobs:
  release:
    name: Signed build, SBOM and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAQVIM_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::TAQVIM_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Verify gates, build signed AAB/APK and SBOM
        env:
          TAQVIM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TAQVIM_KEYSTORE_PASSWORD: ${{ secrets.TAQVIM_KEYSTORE_PASSWORD }}
          TAQVIM_KEY_ALIAS: ${{ secrets.TAQVIM_KEY_ALIAS }}
          TAQVIM_KEY_PASSWORD: ${{ secrets.TAQVIM_KEY_PASSWORD }}
        run: ./gradlew licenseCheck :app:bundleRelease :app:assembleRelease :app:cyclonedxDirectBom
      - name: Changelog from conventional commits
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/reports/cyclonedx-direct/bom.json
            build/reports/licenses/license-report.json
