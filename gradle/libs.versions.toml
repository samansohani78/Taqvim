# Taqvim version catalog. Latest stable versions pinned on 2026-09-13; Renovate keeps them current.
# License policy: only permissive dependencies (see docs/adr/0003-license-policy.md). The license gate
# (`./gradlew licenseCheck`) enforces this for every resolved (including transitive) dependency.

[versions]
# Toolchain
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.12"
lint = "32.4.0"
# Kotlin libraries
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
immutable = "0.5.2"
# AndroidX
compose-bom = "2026.09.00"
navigation3 = "1.1.7"
lifecycle = "2.11.0"
activity = "1.13.0"
core-ktx = "1.19.0"
room = "2.8.5"
datastore = "1.2.1"
work = "2.11.2"
glance = "1.2.0"
browser = "1.10.0"
adaptive = "1.3.0"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
# Debug-only leak detection (T-1803)
leakcanary = "2.14"
# Wear OS (T-1600)
wear-compose = "1.6.2"
wear-tiles = "1.6.2"
wear-protolayout = "1.4.2"
wear-complications = "1.3.0"
concurrent-futures = "1.3.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
uiautomator = "2.4.0"
# Third-party runtime
koin-bom = "4.2.2"
astronomy = "2.1.19"
icu4j = "78.3"
zxing = "3.5.4"
protobuf = "4.36.1"
protobuf-plugin = "0.10.0"
kotlinpoet = "2.4.0"
# Build tooling (:tools:*)
json-schema-validator = "3.0.7"
# Testing
junit = "6.1.3"
junit4 = "4.13.2"
kotest = "6.2.5"
turbine = "1.2.1"
robolectric = "4.17"
roborazzi = "1.74.0"
mockk = "1.14.11"
konsist = "0.17.3"
jazzer = "0.30.0"
# Quality
detekt = "1.23.8"
# Kotlin compiler version that detekt 1.23.8 is built against; detekt's classpath is pinned to it.
detekt-kotlin = "2.0.21"
spotless = "8.10.2"
ktlint = "1.8.0"
kover = "0.9.9"
cyclonedx = "3.4.1"

[libraries]
# --- Gradle plugins (consumed by build-logic) ---
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
roborazzi-gradlePlugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
protobuf-gradlePlugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }
cyclonedx-gradlePlugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx" }

# --- Kotlin ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
