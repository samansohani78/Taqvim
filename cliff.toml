# git-cliff configuration: changelog generated from conventional commits (T-003 release workflow).
[changelog]
header = "# Changelog\n"
# A commit marked `!` or carrying a BREAKING CHANGE footer is listed first, by what the footer says changes for the
# user, and again in its own group below. Without this, 1.3.0's removal of device-calendar events read as the third
# line of "Features" and nothing in the notes said anything had been taken away.
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) %}{% if breaking | length > 0 %}
### Breaking changes
{% for commit in breaking %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.breaking_description | trim | replace(from="\n", to=" ") | upper_first }}
{% endfor %}{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Commits that match no parser are dropped (docs/RELEASE.md, "Changelog").
filter_commits = true
commit_parsers = [
  # Bookkeeping commits that only update PROGRESS, PROVENANCE or DATA_TODO (T-1900).
  { message = "^docs(\\([^)]*\\))?: (record|mark|order) ", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^(build|ci)", group = "Build & CI" },
  { message = "^(chore|style|wip)", skip = true },
]
tag_pattern = "v[0-9]*"
