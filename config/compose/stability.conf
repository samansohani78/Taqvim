// Classes treated as stable by the Compose compiler (T-1802, ADR-0021).
// Pure JVM :core modules are compiled without the Compose compiler, so their types count as unstable unless listed.
// Every entry is an immutable value type: only `val` properties of immutable types and no mutable state
// (Konsist forbids mutable global state; `composeStabilityCheck` fails on anything unstable that is not listed).

// kotlinx.datetime and kotlin.time value types are immutable.
kotlinx.datetime.*
kotlin.time.Instant
// Read-only integer range used by pickers and wheels.
kotlin.ranges.IntRange

// :core:model — dates and places.
ir.taqvim.core.model.CalendarDate
ir.taqvim.core.model.Coordinates
// :core:i18n — one launch language's formatting data (data class of vals and read-only lists).
ir.taqvim.core.i18n.LanguageSpec
// :core:calendar — years/months/days difference.
ir.taqvim.core.calendar.DatePeriod
// :core:praytimes — method, Asr convention and high-latitude rule of a prayer-time request.
ir.taqvim.core.praytimes.PrayerSettings
// :core:astronomy — computed positions and eclipses.
ir.taqvim.core.astronomy.SkyPosition
ir.taqvim.core.astronomy.LunarEclipse
ir.taqvim.core.astronomy.GlobalSolarEclipse
// :core:ics — validated recurrence rule (data class of vals and read-only lists).
ir.taqvim.core.ics.RecurrenceRule
// :core:workdays — calculator configured once at construction; it holds no mutable state.
ir.taqvim.core.workdays.WorkdayCalculator
