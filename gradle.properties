# Resource budget sized for 14 GB developer machines: an unbounded build exhausted RAM and triggered the
# kernel OOM killer (2026-09-13). See docs/adr/0004-module-and-toolchain-deviations.md §9.
# CI runners may raise these with -Dorg.gradle.workers.max=… / -Ptaqvim.maxForkedJvms=….
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.daemon.idletimeout=1200000
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m
# Max concurrently running forked JVMs (test workers + detekt), enforced by a shared build service.
taqvim.maxForkedJvms=2
android.useAndroidX=true
android.nonTransitiveRClass=true
