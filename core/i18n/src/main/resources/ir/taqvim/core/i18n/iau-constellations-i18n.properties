# Per-language names of the 88 IAU constellations (DT-026), layered over iau-constellations.properties' universal
# IAU Latin names (see that file's header) the same way hebrew-months-mt.properties layers over hebrew-months.properties
# — one language block per national astronomical authority found and verified, key `<language code>.<IAU abbreviation>`.
# These are cited facts (a name and its constellation), not a licensed creative work: LicenseRef-Cited-Publication,
# config/license/allowed-licenses.json, no attribution required, docs/PROVENANCE.md carries the full citation.
#
# ja.*: the National Astronomical Observatory of Japan (国立天文台, NAOJ — Japan's national astronomy institute, part
#   of the National Institutes of Natural Sciences), "星座名・星座略符一覧(星座名順)" ("List of constellation names and
#   abbreviations, by name"), https://www.nao.ac.jp/new-info/constellation.html, retrieved 2026-09-25 (SHA-256 of the
#   fetched page 859a737b66f2ae380739c39762d25e134bee676030ad0689d693c566f96358db). Read directly from the page's own
#   HTML table (Shift-JIS encoded; parsed with a script, not summarized by a model, after a first summarized fetch
#   produced two rows for a duplicated abbreviation — a transcription error caught by cross-checking the raw table).
#   All 88 abbreviations matched IauConstellationNames' key set exactly, including Ser (Serpens), whose row uses a
#   `rowspan` for its two non-contiguous halves (head/tail) and needed a separate extraction path. The table's own
#   "name" column gives each constellation's reading in hiragana/katakana with an optional parenthetical kanji gloss
#   and, for the 12 zodiacal constellations, a "＊" marker (the page's own explanatory text: "星座名は　ひらがな　または
#   　カタカナ　で表記します" — constellation names are written in hiragana or katakana; kanji is shown in brackets only
#   so the name's meaning is clear). The kanji gloss and "＊" marker are dropped and the standard "座" ("-za", the
#   Japanese suffix meaning "constellation") is appended to the reading, per the page's own usage of that suffixed
#   form in running text (e.g. "オリオン座α星" for "α Orionis").
