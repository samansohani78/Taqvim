# Full (FULL/LONG) date patterns for language/calendar pairs where CLDR stores only its root fallback
# `[G ]y MMMM d, EEEE` (T-202, docs/DATA_TODO.md DT-025, docs/adr/0050-pashto-persian-long-date-pattern.md).
# `formats.properties` stays generated CLDR data; these entries are merged over it by FormatTable.
#
# Why these are pinned strings rather than a rule. ADR-0050 originally gave `ps` the language's own CLDR *Gregorian*
# full pattern, reusing whatever CLDR currently stored instead of writing a pattern down. That was deliberate — it
# kept the override a rule rather than a copy — but it makes the result depend on a value CLDR is free to change,
# and CLDR did change it. Measured 2026-10-05 against ICU 79.1rc, which carries CLDR 49: `ps-AF` Gregorian FULL goes
# from `EEEE د y د MMMM d` (CLDR 48.2, the form below) to `EEEE d, MMMM, y` — day first, with Latin commas, which is
# the very shape ADR-0014 and ADR-0050 exist to remove. Deriving the pattern would therefore have reintroduced the
# defect on an ICU bump. The string is pinned here instead, with the evidence that justifies it, so a bump changes
# nothing silently and the reasoning survives in the file rather than in a release of CLDR.
#
# ps.persian (2026-10-05): the string is CLDR 48.2 `common/main/ps.xml`, gregorian `dateFormatLength type="full"` —
#   reviewed Pashto data, using the `د` genitives the language actually writes. Its field order, year → month → day,
#   is corroborated independently by the covers of Afghanistan's Official Gazette, serials 1150, 1229, 1306, 1310,
#   1329, 1334 and 1424, spanning 1393–1401 هـ.ش (see sourced-eras.properties for the URLs). The gazette corroborates
#   the ORDER only and cannot source the pattern itself: no cover prints a weekday while a FULL pattern carries
#   `EEEE`, the cover line is a masthead label — a genitive formula with the day in parentheses — so rendering it as
#   a pattern would mean inventing literals, and the Pashto and Dari lines on the same page disagree in order.
#   The Islamic calendar is NOT pinned: it keeps CLDR's root pattern and still shows its sourced era (ADR-0050 §4).
ps.persian=EEEE د y د MMMM d
