# Era abbreviations for language/calendar pairs Unicode CLDR has none for (T-202, docs/DATA_TODO.md DT-008).
# Hand-curated from an official publication written in the language itself, never translated, and cited per entry
# below. `formats.properties` stays generated CLDR data; these entries are merged over it by FormatTable.
#
# ps.persian, ps.islamic (2026-09-26): the cover of every issue of "رسمي جریده" (Rasmi Jarida), the Official Gazette
#   of Afghanistan published by its Ministry of Justice, prints the publication date twice, once in Pashto
#   ("د خپرېدو نېټه") and once in Dari ("تاریخ نشر"), and marks the year with an era abbreviation. Serial 1424 dates
#   in both calendars at once: "د ۱۴۴۴ هـ.ق کال د ربیع الثاني د میاشتې (۱۰)" and "د ۱۴۰۱ هـ.ش کال د لړم د میاشتې (۱۴)"
#   (https://web.archive.org/web/20221124045802id_/http://old.moj.gov.af/Content/files/OfficialGazette/01401/OG_01424.pdf,
#   linked from https://moj.gov.af/en/node/1515). Serials 1150, 1306, 1310, 1329 and 1334 print the solar form the
#   same way, and serial 1229 as scanned by the Afghanistan Centre at Kabul University
#   (https://faolex.fao.org/docs/pdf/afg209805.pdf). The letter before the full stop is a tatweel (U+0640) and there
#   is no trailing full stop, unlike CLDR's Persian "ه‍.ش.".
ps.persian=هـ.ش
ps.islamic=هـ.ق
