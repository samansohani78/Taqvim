# Bikram Sambat names (T-105, docs/adr/0030-nepali-calendar-computed.md addendum). Hand-curated from official sources,
# not CLDR (CLDR has no Bikram Sambat calendar). Owner decision 2026-09-16: Nepali script for `ne`, the Government of
# Nepal's English spellings for every other language until human translators supply names.
#
# months.ne: civil month names as printed in the planet-table headings ("२०८३ <month>") of the Rashtriya Panchangam
#   BS 2083, Nepal Panchanga Nirnayak Vikas Samiti (Government of Nepal),
#   https://giwmscdnone.gov.np/media/pages/files/FORMAT-2083-A_7f75xmb.pdf
#   (SHA-256 e7615a149018edd41e6239f7d0ed0c513f94e0566277dca7af41347c62713bde), pages 4, 6, 9, 11, 13, 15, 17, 19,
#   21, 23 and 25; the first month has no heading, so its name is the one printed in the "वैशाखसंक्रान्ति" entry and
#   the "वै." day label on page 2. Read from the page images (the PDF has no text layer).
# months.latin: the most frequent spelling of each month printed on page 1 of the Nepal Telecommunications Authority
#   monthly MIS reports BS 2070–2080 (https://nta.gov.np/uploads/contents/MIS-<year>-<month>.pdf; every report is
#   listed with its SHA-256 in core/calendar/src/test/resources/golden/nepal/nta-month-starts.csv).
# era.ne: "वि.सं." as printed on the Panchang's cover and page headers. The NTA reports print no era abbreviation, so
#   other languages have none.
# pattern.ne (DT-010, resolved 2026-09-25): "day, full month name, comma, year" — no weekday, no era abbreviation in
#   the date string itself — read directly from two independent Government of Nepal sources showing an actual written
#   date, not just a month name: the Nepal Law Commission's official statute pages (lawcommission.gov.np), e.g.
#   "१३ माघ, २०८१" on its Nepal Law Commission Act, 2063 page (https://lawcommission.gov.np/content/13371/nepal-law-commission-act-2063/,
#   retrieved 2026-09-25), and the Department of Printing's Nepal Gazette upload listing (https://dop.gov.np/category/upload-nepal-gazette/,
#   retrieved 2026-09-25), e.g. "८ असोज, २०८३". Both independently show the same "d MMMM, y" order with a Latin comma;
#   वि.सं. appears on these sites only as a separate calendar-system label, never glued onto the date itself, so the
#   pattern carries no G. A weaker, uncorroborated data point was seen and NOT used: the Office of the Prime Minister
#   and Council of Ministers (opmcm.gov.np) titles some releases "मिति २०८२ चैत १३" (year month day, no comma), which
#   reads as a compact title/slug convention rather than a written-prose date, from a single source against two
#   agreeing ones.
months.ne=वैशाख|जेठ|असार|साउन|भदौ|असोज|कात्तिक|मङ्सिर|पुस|माघ|फागुन|चैत
months.latin=Baishakh|Jestha|Ashad|Shrawan|Bhadra|Ashwin|Kartik|Mangsir|Poush|Magh|Falgun|Chaitra
era.ne=वि.सं.
pattern.ne=d MMMM, y
