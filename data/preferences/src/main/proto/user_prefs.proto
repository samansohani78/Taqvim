//
// User preferences (docs/PLAN.md §4.4, T-600). Enum values mirror :core:model / :core:i18n enums by name after the
// prefix; value 0 is always UNSPECIFIED so that missing or unknown values fall back to language defaults.

syntax = "proto3";

package taqvim.preferences;

option java_package = "ir.taqvim.data.preferences.proto";
option java_multiple_files = true;

enum CalendarSystemProto {
  CALENDAR_SYSTEM_UNSPECIFIED = 0;
  CALENDAR_SYSTEM_PERSIAN = 1;
  CALENDAR_SYSTEM_ISLAMIC = 2;
  CALENDAR_SYSTEM_GREGORIAN = 3;
  CALENDAR_SYSTEM_NEPALI = 4;
}

enum NumeralSystemProto {
  NUMERAL_SYSTEM_UNSPECIFIED = 0;
  NUMERAL_SYSTEM_LATIN = 1;
  NUMERAL_SYSTEM_PERSIAN = 2;
  NUMERAL_SYSTEM_EASTERN_ARABIC = 3;
  NUMERAL_SYSTEM_DEVANAGARI = 4;
  NUMERAL_SYSTEM_TAMIL = 5;
}

enum WeekdayProto {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

enum PrayerMethodProto {
  PRAYER_METHOD_UNSPECIFIED = 0;
  PRAYER_METHOD_MWL = 1;
  PRAYER_METHOD_ISNA = 2;
  PRAYER_METHOD_EGYPT = 3;
  PRAYER_METHOD_MAKKAH = 4;
  PRAYER_METHOD_KARACHI = 5;
  PRAYER_METHOD_TEHRAN = 6;
  PRAYER_METHOD_JAFARI = 7;
  PRAYER_METHOD_SINGAPORE = 8;
  PRAYER_METHOD_FRANCE = 9;
  PRAYER_METHOD_RUSSIA = 10;
}

enum AsrJuristicProto {
  ASR_JURISTIC_UNSPECIFIED = 0;
  ASR_JURISTIC_STANDARD = 1;
  ASR_JURISTIC_HANAFI = 2;
}

enum IslamicVariantProto {
  ISLAMIC_VARIANT_UNSPECIFIED = 0;
  ISLAMIC_VARIANT_IRAN_OFFICIAL = 1;
  ISLAMIC_VARIANT_UMM_AL_QURA = 2;
  ISLAMIC_VARIANT_TABULAR_16 = 3;
  ISLAMIC_VARIANT_TABULAR_15 = 4;
  ISLAMIC_VARIANT_CALCULATED_OBSERVATIONAL = 5;
}

enum ThemeModeProto {
  THEME_MODE_UNSPECIFIED = 0;
  THEME_MODE_SYSTEM = 1;
  THEME_MODE_LIGHT = 2;
  THEME_MODE_DARK = 3;
  THEME_MODE_BLACK = 4;
}

enum PlaceSourceProto {
  PLACE_SOURCE_UNSPECIFIED = 0;
  PLACE_SOURCE_CITY = 1;
  PLACE_SOURCE_DEVICE = 2;
  PLACE_SOURCE_COORDINATES = 3;
}

// The place chosen in the location settings (T-1502); absent until the user chooses one.
message ChosenPlaceProto {
  PlaceSourceProto source = 1;
  // Natural Earth id of the city (T-603); 0 for places that are not catalog cities.
  int64 city_id = 2;
  // Display name at the time of choosing; empty when none was known.
  string name = 3;
  double latitude = 4;
  double longitude = 5;
  // IANA time zone id.
  string zone_id = 6;
}

enum AthanPrayerProto {
  ATHAN_PRAYER_UNSPECIFIED = 0;
  ATHAN_PRAYER_FAJR = 1;
  ATHAN_PRAYER_DHUHR = 2;
  ATHAN_PRAYER_ASR = 3;
  ATHAN_PRAYER_MAGHRIB = 4;
  ATHAN_PRAYER_ISHA = 5;
}

// The athan alert of one prayer (T-1101).
message AthanPrayerAlertProto {
  AthanPrayerProto prayer = 1;
  bool enabled = 2;
  // Minutes from the prayer time to the athan; negative is before the time.
  int32 gap_minutes = 3;
}

// Athan settings (T-1101); absent in stores written before T-1101, which read as the defaults.
message AthanSettingsProto {
  repeated AthanPrayerAlertProto alerts = 1;
  // Content URI of the sound picked by the user; empty = the default alarm sound.
  string sound_uri = 2;
  // Display name of the picked sound; empty when unknown.
  string sound_name = 3;
  bool vibrate = 4;
  // Whether the Fajr athan may sound while Do Not Disturb is on.
  bool bypass_dnd_for_fajr = 5;
  int32 volume_percent = 6;
  // Whether athan times use Iran Standard Time (UTC+03:30) instead of the time zone rules of the place.
  bool use_iran_time = 7;
}

message UserPrefs {
  // 0 = never initialised; see UserPrefsMigration.CURRENT_SCHEMA_VERSION.
  int32 schema_version = 1;
  string language_code = 2;
  // Calendars in priority order; the first is the main calendar.
  repeated CalendarSystemProto calendars = 3;
  NumeralSystemProto numerals = 4;
  WeekdayProto week_start = 5;
  repeated WeekdayProto weekend = 6;
  PrayerMethodProto prayer_method = 7;
  AsrJuristicProto asr_juristic = 8;
  IslamicVariantProto islamic_variant = 9;
  ThemeModeProto theme_mode = 10;
  int32 hijri_offset_days = 11;
  // Epoch milliseconds when the Hijri offset was set; 0 = no offset.
  int64 hijri_offset_set_at_epoch_millis = 12;
  // Chosen place (T-1502); an optional field, so stores written before it read as "no place".
  ChosenPlaceProto place = 13;
  // Athan settings (T-1101); an optional field, so stores written before it read as the athan defaults.
  AthanSettingsProto athan = 14;
  // Appearance, calendar display, events, prayer, notification, search and tool settings (T-1500); an optional field,
  // so stores written before it read as the app settings defaults.
  AppSettingsProto app_settings = 15;
  // Whether the first-run onboarding (T-1501) was completed or skipped on this device; stores written before it read
  // as false, so the onboarding is shown once. Not carried in backups (ADR-0023).
  bool onboarding_completed = 16;
}

enum EventSourceProto {
  EVENT_SOURCE_UNSPECIFIED = 0;
  EVENT_SOURCE_IRAN_OFFICIAL = 1;
  EVENT_SOURCE_AFGHANISTAN_OFFICIAL = 2;
  EVENT_SOURCE_NEPAL_OFFICIAL = 3;
  EVENT_SOURCE_INTERNATIONAL = 4;
  EVENT_SOURCE_ANCIENT_IRAN = 5;
}

enum HighLatitudeRuleProto {
  HIGH_LATITUDE_RULE_UNSPECIFIED = 0;
  HIGH_LATITUDE_RULE_NONE = 1;
  HIGH_LATITUDE_RULE_MIDDLE_OF_NIGHT = 2;
  HIGH_LATITUDE_RULE_ONE_SEVENTH = 3;
  HIGH_LATITUDE_RULE_ANGLE_BASED = 4;
  HIGH_LATITUDE_RULE_GEOPHYSICS_WHITE_NIGHTS = 5;
}

// Bubble level calibration of one device orientation (T-1303), in degrees.
message LevelOffsetProto {
  // Orientation name as used by the level (e.g. FLAT, PORTRAIT, LANDSCAPE).
  string orientation = 1;
  double pitch_degrees = 2;
  double roll_degrees = 3;
}

// Settings screens (T-1500). Every field is explicit once the message is present.
message AppSettingsProto {
  bool dynamic_color = 1;
  bool high_contrast = 2;
  bool bold_text = 3;
  bool gradient = 4;
  bool show_week_numbers = 5;
  // Event sources shown in the calendar; personal events are always shown.
  repeated EventSourceProto enabled_event_sources = 6;
  HighLatitudeRuleProto high_latitude_rule = 7;
  // Whether calendar subscriptions (T-1003) may refresh over the network.
  bool subscriptions_network_allowed = 8;
  // Whether the persistent date notification (T-1213) is shown.
  bool persistent_notification = 9;
  bool remember_recent_searches = 10;
  // Newest first (T-804).
  repeated string recent_searches = 11;
  // IANA zone ids on the time zone board (T-1400), in display order.
  repeated string time_zone_board = 12;
  repeated LevelOffsetProto level_offsets = 13;
  // Minute of the day when all-day and official-event reminders sound (T-1001, T-1002); absent means 09:00.
  optional int32 all_day_reminder_minute = 14;
  // Whether the user chose enabled_event_sources; while false they follow the language default (ADR-0007 §3).
  // Stores written before this field ignore their list and take the language default.
  bool event_sources_chosen = 15;
  // The persistent date notification (T-1213) shows the day number as a large icon.
  bool persistent_notification_large_number = 16;
  // The launcher icon shows today's day number (T-1214, ADR-0022); off by default.
  bool dynamic_launcher_icon = 17;
}
